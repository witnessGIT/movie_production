[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-production-backend"
version = "0.2.0"
description = "Visual news/video production orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
media = ["faster-whisper>=1.0", "scenedetect[opencv]>=0.6.5", "yt-dlp>=2025.1"]
browser = ["playwright>=1.47"]
all = [
  "faster-whisper>=1.0",
  "scenedetect[opencv]>=0.6.5",
  "yt-dlp>=2025.1",
  "playwright>=1.47"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
